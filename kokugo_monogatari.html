<script>
// 物語データ：名作（著作権切れ）をやさしく要約したもの
// 記法：[[指示語]]  ((まぎらわしい言葉|説明))  {{A:接続詞}}  <<語|よみ|意味>>（タップで読みと意味を表示）
const DO = '「ど」ではじまることばは、たずねたり、まとめて言ったりする言葉で、何かを指しているわけではありません。そのため、この練習では指示語にふくめません。';

const STORIES = [
{
  icon: '🕷️', title: '蜘蛛の糸', author: '芥川龍之介', genre: 'ふしぎ・教訓',
  blurb: '地獄でくるしむ大どろぼうに、お釈迦様が一本の糸を下ろします。',
  parts: [
  { t: 'ひとすじの光', lv: 1,
    tx: `むかし、((カンダタ))という大どろぼうがいました。人の物をぬすみ、家に火をつけるなど、<<悪事|あくじ|悪いおこない>>ばかりしていた男です。カンダタは死んだあと、<<地獄|じごく|悪いことをした人が、死んだあとに行ってくるしむといわれる世界>>に落とされました。[[そこ]]は、暗くて、さむくて、{{A:しかも}}((針の山))がつづく、おそろしい所でした。カンダタは、毎日くるしみ続けていました。{{B:ところが}}、ある日、ふと上を見ると、<<はるか|はるか|とても遠いようす>>上のほうから、一本の細い銀色の糸が、するするとおりてきたのです。`,
    ref: { i: 0, o: ['地獄', 'カンダタの家', '大どろぼうの町', '空の上の世界'], w: '直前の文に「地獄に落とされました」とあります。「そこ」は地獄を指しています。' },
    gist: { tpl: '大どろぼうのカンダタは、死んだあと[1]に落とされ、くるしんでいた。ある日、上から[2]がおりてきた。', b: [{ o: ['地獄', '天国', 'ふるさと'], w: '本文の三つ目の文を見よう。' }, { o: ['細い銀色の糸', '太いなわ', 'はしご'], w: '最後の文に書かれています。' }] },
    conj: [{ o: ['しかも', 'しかし', 'なぜなら', 'または'], w: '「暗い・さむい」に、さらに「針の山」とつけ加えています。つけ加える「しかも」。' }, { o: ['ところが', 'だから', 'つまり', 'たとえば'], w: 'くるしみ続けていたのに、とつぜん糸が下りてきた。思いがけないことをつなぐ「ところが」。' }],
    q: { s: '「カンダタは、毎日くるしみ続けていました」とありますが、カンダタが地獄でくるしんでいる理由として最も適切なものはどれですか。', ev: '人の物をぬすみ、家に火をつけるなど、悪事ばかりしていた男です。',
      o: [['生きていたとき、ぬすみや放火などの悪事を重ねたから。', '本文の最初に悪事ばかりしていたとあり、そのむくいとして地獄に落とされています。'], ['お釈迦様にきらわれて、いじわるされたから。', 'お釈迦様は、まだ登場していません。'], ['道に迷って、地獄に来てしまっただけだから。', '道に迷ったという記述はありません。'], ['ほかの人の身代わりになったから。', '身代わりの話は出てきません。']] },
    tz: 'たった一本の細い糸。それを下ろしたのは、いったいだれでしょう。' },
  { t: 'お釈迦様の思い出', lv: 2,
    tx: `[[その]]ころ、<<極楽|ごくらく|苦しみのない、とても美しい平和な世界>>では、((お釈迦様))が池のふちを散歩していました。水の底をのぞくと、((地獄))でくるしむカンダタの姿が見えました。お釈迦様は、カンダタがたった一度だけ、よいことをしたのを思い出しました。[[それ]]は、森で小さな<<蜘蛛|くも|八本の足を持ち、糸で巣をつくる生き物>>を見つけたとき、ふみつぶさずに助けてやったことです。{{A:そこで}}、お釈迦様は、一本の蜘蛛の糸を、地獄へそっと下ろしてやりました。糸を見つけたカンダタは、よろこびました。「[[これ]]につかまって上れば、地獄からぬけ出せるぞ。」{{B:そして}}、カンダタは、糸をにぎって、<<必死|ひっし|死にものぐるいで、全力でがんばること>>にのぼりはじめたのです。`,
    ref: { i: 1, o: ['カンダタがたった一度だけしたよいこと', 'お釈迦様が池を散歩していたこと', 'カンダタが地獄に落ちたこと', '水の底をのぞいたこと'], w: '直前の文の「たった一度だけ、よいことをした」を指しています。あとの「蜘蛛を助けてやったこと」が、そのくわしい説明です。' },
    gist: { tpl: 'お釈迦様は、カンダタが一度だけ[1]を助けたことを思い出し、地獄へ[2]を下ろした。', b: [{ o: ['蜘蛛', '犬', '小鳥'], w: '「森で小さな蜘蛛を見つけたとき」とあります。' }, { o: ['蜘蛛の糸', 'はしご', '手紙'], w: '「一本の蜘蛛の糸を、地獄へそっと下ろして」とあります。' }] },
    conj: [{ o: ['そこで', 'しかし', 'なぜなら', 'または'], w: 'よいことを思い出した結果、糸を下ろすことにした。前のことを受けて行動をつなぐ「そこで」。' }, { o: ['そして', 'しかし', 'なぜなら', 'または'], w: '糸を見つけてよろこび、そのあと上りはじめた。つづけて起こったことをつなぐ「そして」。' }],
    q: { s: 'お釈迦様がカンダタに糸を下ろしてやった理由として最も適切なものはどれですか。', ev: 'カンダタがたった一度だけ、よいことをした…ふみつぶさずに助けてやったことです。',
      o: [['カンダタが、小さな蜘蛛を助けたことがあったから。', 'たった一つのよいことを思い出し、すくいの手をさしのべています。'], ['カンダタが大金をわたしたから。', 'お金の話は出てきません。'], ['カンダタがお釈迦様にたのんだから。', 'カンダタはたのんでいません。糸を見つけたのはそのあとです。'], ['地獄がこわれてしまったから。', '地獄がこわれたという記述はありません。']] },
    tz: '糸をのぼりはじめたカンダタ。ところが、ふと下を見ると…？' },
  { t: 'ぷつりと切れた糸', lv: 3,
    tx: `カンダタは、一生けんめい糸をのぼりました。ずいぶん上まで来たとき、ふと下を見ると、((地獄の者たち))が、数えきれないほど糸にすがって、のぼってくるではありませんか。カンダタはあわてました。「[[この]]細い糸が、[[あれ]]だけの人数にたえられるはずがない。」{{A:そこで}}、カンダタは大声でさけびました。「こら、<<罪人|ざいにん|悪いことをした人>>ども。[[この]]糸は、おれのものだぞ。おりろ、おりろ。」{{B:すると}}、[[その]]<<瞬間|しゅんかん|ほんの短い時間>>、糸はカンダタの上でぷつりと切れ、カンダタは、もとの地獄へ落ちていきました。お釈迦様は、池のふちから、<<一部始終|いちぶしじゅう|はじめから終わりまで、すべて>>を悲しそうなお顔で見ていました。`,
    ref: { i: 1, o: ['糸をのぼってくる、数えきれないほどの地獄の者たち', 'カンダタ自身', 'お釈迦様', '地獄の針の山'], w: '「あれだけの人数」は、すぐ前の文の「糸にすがってのぼってくる地獄の者たち」を指しています。' },
    gist: { tpl: 'カンダタは、糸にすがる者たちに[1]とさけんだため、糸が[2]。', b: [{ o: ['「おりろ」', '「いっしょに上ろう」', '「ありがとう」'], w: '「おりろ、おりろ。」とさけんでいます。' }, { o: ['切れてしまった', '太くなった', 'ゆれただけだった'], w: '「ぷつりと切れ」とあります。' }] },
    conj: [{ o: ['そこで', 'しかし', 'なぜなら', 'または'], w: '糸がたえられないと思った結果、さけんだ。前のことを受けて行動をつなぐ「そこで」。' }, { o: ['すると', 'しかし', 'または', 'たとえば'], w: 'さけんだ直後に糸が切れた。あとに起こったことをつなぐ「すると」。' }],
    q: { s: 'お釈迦様が、悲しそうなお顔で見ていた理由として最も適切なものはどれですか。', ev: '「この糸は、おれのものだぞ。おりろ、おりろ。」…糸はカンダタの上でぷつりと切れ',
      o: [['カンダタが自分だけ助かろうとして、ふたたび地獄に落ちたから。', '他の人を追いはらおうとした心が、糸を切る結果になりました。それを見て悲しんでいます。'], ['カンダタが糸を上りきって、極楽に来たから。', '糸は切れて、カンダタは落ちています。'], ['地獄の者たちが全員助かったから。', '助かったとは書かれていません。'], ['お釈迦様が、糸を切るつもりで下ろしたから。', 'お釈迦様は、助けようとして糸を下ろしています。']] },
    tz: '『蜘蛛の糸』はここまで。自分だけ助かろうとする心が、糸を切ってしまいました。' }
  ]
},
{
  icon: '🏃', title: '走れメロス', author: '太宰治', genre: '友情・勇気',
  blurb: '王との約束を守るため、友のために走りつづける青年のお話。',
  parts: [
  { t: '激怒したメロス', lv: 1,
    tx: `メロスは、村で羊の世話をしている、正直で正義感の強い青年です。妹の結婚式の買い物をするため、メロスはシラクスの町へやってきました。{{A:ところが}}、町はしんと静まり返り、人々に元気がありません。「どうしたのですか。」とたずねると、((老人))は小さな声で答えました。「王様が、人を信じられなくなって、次々と人をころしているのです。」メロスは<<激怒|げきど|ひどくおこること>>しました。「[[そんな]]<<邪智暴虐|じゃちぼうぎゃく|ずるがしこくて、らんぼうで、人にひどいことをすること>>の王は、ゆるせない。」{{B:そして}}、メロスは短刀を持ったまま、((王の城))へ入っていきました。`,
    ref: { i: 0, o: ['王様が人を信じられず、次々と人をころしていること', '町が静まり返っていること', 'メロスが買い物に来たこと', '妹の結婚式があること'], w: '「そんな邪智暴虐の王」は、老人が話した「人を信じられなくなり、次々と人をころしている」王のおこないを受けています。' },
    gist: { tpl: 'メロスは町で、王様が[1]いると聞いて、[2]した。', b: [{ o: ['人々をころして', '人々に食べ物を配って', '町を守って'], w: '老人の話を見直そう。' }, { o: ['激怒', '安心', '感動'], w: '「ゆるせない」と言っています。' }] },
    conj: [{ o: ['ところが', 'だから', 'つまり', 'たとえば'], w: '買い物に来た（ふつうの町を想像）のに、町は静まり返っていた。思いと反対の様子をつなぐ「ところが」。' }, { o: ['そして', 'しかし', 'なぜなら', 'または'], w: 'ゆるせないと思い、そのあとに城へ入った。つづく行動をつなぐ「そして」。' }],
    q: { s: '「メロスは激怒しました」とありますが、メロスがおこった理由として最も適切なものはどれですか。', ev: '王様が、人を信じられなくなって、次々と人をころしているのです。',
      o: [['王様が、人を信じられず、罪のない人々をころしていると知ったから。', '老人の話を聞いて、正義感の強いメロスがゆるせないと感じました。'], ['王様に結婚式をじゃまされたから。', '結婚式をじゃまされた話はありません。'], ['買い物のお金をぬすまれたから。', 'お金をぬすまれた話はありません。'], ['町の人にばかにされたから。', 'ばかにされた場面はありません。']] },
    tz: '短刀を持って城へ入ったメロス。すぐに兵士につかまり、王の前に…。' },
  { t: '三日間の約束', lv: 2,
    tx: `メロスは、すぐに兵士につかまり、王の前に引き出されました。「人殺しの王から、[[この]]町を救うのだ。」メロスが[[そう]]言うと、王は<<冷ややか|ひややか|心がこもらず、つめたいようす>>に笑いました。「人の心など、信じられぬ。人はみな、<<私欲|しよく|自分だけが得をしたいと思う心>>のかたまりだ。」メロスは<<処刑|しょけい|刑として、命をうばうこと>>されることを覚悟して言いました。「私はどうなってもかまいません。{{A:ただし}}、妹の結婚式のために、三日間だけ時間をください。そのかわり、友人の((セリヌンティウス))を<<人質|ひとじち|約束を守らせるために、あずかっておく人>>として置いていきます。私がもどらなければ、友人を殺してください。」王は、うす笑いをうかべました。「[[その]]条件をのんでやろう。」王は、メロスがにげると決めつけて、心の中で笑っていました。{{B:しかし}}、メロスは友を信じ、友もメロスを信じていました。`,
    ref: { i: 2, o: ['三日間のうちにもどり、友人を人質に置くという条件', '妹が結婚するという事実', '王が人を信じないこと', 'メロスがつかまったこと'], w: 'メロスは「三日間の時間がほしい。かわりに友人を置いていく」と申し出ました。その内容を、王は「その条件」と呼んでいます。' },

  { t: 'おかしな注文', lv: 2,
    tx: `玄関の戸には「<<当店|とうてん|この店>>は注文の多い料理店ですから、どうかご<<承知|しょうち|わかって、受け入れること>>ください」と書いてありました。「きっと、はやっている店なんだな。」二人は、<<廊下|ろうか|建物の中の長い通り道>>を進みました。次の戸には「どうぞ、髪をととのえ、くつの泥を落としてください」とあります。{{A:そして}}、その次の戸には、「鉄ぽうとたまを、[[ここ]]に置いてください」と書かれていました。二人は[[それ]]にしたがい、次々と戸をあけていきました。{{B:ところが}}、だんだん、おかしな注文ばかりが増えてきました。「ネクタイピン、メガネ、財布などの金物類は、ここに置いてください。」二人は、ふしぎに思いながらも、言われた通りにしました。`,

<script>
(function () {
  const KEY = 'kokugo_monogatari_v1';
  let save = {};
  try { save = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { save = {}; }
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };
  const $ = id => document.getElementById(id);
  const $app = $('app');
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  // 語句の読み・意味（タップで表示）
  const gl = s => esc(s).replace(/&lt;&lt;(.+?)\|(.*?)\|(.*?)&gt;&gt;/g, (m, w, y, mm) =>
    `<span class="gl" data-y="${y}" data-m="${mm}" title="${y}　${mm}">${w}</span>`);
  const praise = ['すばらしい！', 'その調子！', 'よく読めています！', 'ばっちり！', 'いいぞ！'];

  // ---- 解析 ----
  const RE = /\[\[(.+?)\]\]|\(\((.+?)\)\)|\{\{([A-Z]):(.+?)\}\}/g;
  function parse(text) {
    const out = []; let last = 0, ri = 0, m; RE.lastIndex = 0;
    while ((m = RE.exec(text))) {
      if (m.index > last) out.push({ k: 't', s: text.slice(last, m.index) });
      if (m[1]) out.push({ k: 'ref', s: m[1], i: ri++ });
      else if (m[2]) { const p = m[2].split('|'); out.push({ k: 'dec', s: p[0], n: p[1] || '' }); }
      else out.push({ k: 'conj', id: m[3], s: m[4] });
      last = RE.lastIndex;
    }
    if (last < text.length) out.push({ k: 't', s: text.slice(last) });
    return out;
  }
  function passage(text, mode, opt) {
    opt = opt || {};
    return '<div class="passage">' + parse(text).map(t => {
      const s = t.k === 't' ? gl(t.s) : esc(t.s);
      if (mode === 'find') {
        if (t.k === 'ref') return `<button class="tok" data-k="ref">${s}</button>`;
        if (t.k === 'dec') return `<button class="tok" data-k="dec" data-n="${esc(t.n)}">${s}</button>`;
        if (t.k === 'conj' && /^[こそあど]/.test(t.s)) return `<button class="tok" data-k="dec" data-n="${esc('「' + t.s + '」は、文と文をつなぐ接続詞です。「そ」ではじまりますが、ものや場所を指しているわけではないので、指示語ではありません。')}">${s}</button>`;
        return s;
      }
      if (mode === 'ref' && t.k === 'ref' && t.i === opt.i) return `<mark>${s}</mark>`;
      if (mode === 'conj' && t.k === 'conj') return `<span class="blank" data-b="${t.id}">【${t.id}】</span>`;
      return s;
    }).join('') + '</div>';
  }
  const plain = text => parse(text).map(t => t.s).join('');

  // ---- 部品 ----
  function choices(host, opts, cfg) {
    const o = shuffle(opts.map((x, i) => Object.assign({}, x, { n: i })));
    host.innerHTML = o.map((x, i) => `<div class="opt"><div class="orow"><button class="optb"><span class="num">${'①②③④'[i]}</span><span class="otx">${gl(x.t)}</span></button>${cfg.elim ? '<button class="x" title="まちがいだと思ったら消す">✕</button>' : ''}</div><div class="why"></div></div>`).join('');
    let ok1 = true, fin = false;
    const els = [...host.querySelectorAll('.opt')];
    els.forEach((el, i) => {
      const xb = el.querySelector('.x');
      if (xb) xb.onclick = () => { if (!fin) el.classList.toggle('struck'); };
      el.querySelector('.optb').onclick = () => {
        if (fin || el.classList.contains('gone')) return;
        const x = o[i];
        if (x.ok) {
          fin = true; el.classList.remove('struck'); el.classList.add('right');
          el.querySelector('.why').innerHTML = '⭕ ' + gl(x.w || cfg.note || '');
          els.forEach((e2, j) => {
            if (j === i) return;
            e2.classList.add('dim');
            if (cfg.revealAll && !e2.classList.contains('gone')) e2.querySelector('.why').innerHTML = '✖ ' + gl(o[j].w || '');
          });
          cfg.onDone(ok1);
        } else {
          ok1 = false; el.classList.add('gone', 'shake');
          el.querySelector('.why').innerHTML = '✖ ' + gl(x.w || 'おしい！もう一度、本文にもどって確かめよう。');
          setTimeout(() => el.classList.remove('shake'), 500);
        }
      };
    });
  }
  function blanks(box, defs, onDone) {
    const host = box.querySelector('.rows');
    host.innerHTML = defs.map(d => `<div class="row" data-b="${d.id}"><div class="rl">${d.label}</div><div class="ropts">${shuffle(d.o).map(w => `<button class="rb">${esc(w)}</button>`).join('')}</div><div class="why"></div></div>`).join('');
    let left = defs.length, good = 0;
    defs.forEach(d => {
      const row = host.querySelector(`.row[data-b="${d.id}"]`);
      let first = true, fin = false;
      row.querySelectorAll('.rb').forEach(b => b.onclick = () => {
        if (fin || b.classList.contains('gone')) return;
        if (b.textContent === d.o[0]) {
          fin = true; if (first) good++;
          b.classList.add('right');
          row.querySelectorAll('.rb').forEach(x => { if (x !== b) x.classList.add('dim'); });
          row.querySelector('.why').innerHTML = '⭕ ' + gl(d.w);
          const sp = box.querySelector(`.blank[data-b="${d.id}"]`);
          if (sp) { sp.textContent = d.o[0]; sp.classList.add('filled'); }
          if (--left === 0) onDone(good);
        } else {
          first = false; b.classList.add('gone', 'shake');
          row.querySelector('.why').innerHTML = '✖ もう一度、前後の文のつながりを考えてみよう。';
          setTimeout(() => b.classList.remove('shake'), 500);
        }
      });
    });
  }

  // ---- 練習の進行 ----
  const STEPS = ['find', 'ref', 'gist', 'conj', 'mcq'];
  const STEPNO = { find: 1, ref: 1, gist: 2, conj: 3, mcq: 4 };
  const STEPNAME = ['指示語', '要点', '接続詞', '選択問題'];
  const LV = { 1: 'Lv.1 はじめの一歩', 2: 'Lv.2 ステップアップ', 3: 'Lv.3 チャレンジ' };
  let run = null;

  function startPart(si, pi) { run = { si, pi, step: 0, first: 0, total: 7 }; stepView(); }
  function head() {
    const s = STORIES[run.si], p = s.parts[run.pi], n = STEPNO[STEPS[run.step]];
    return `<div class="top"><button class="back" id="bk">← もどる</button><div class="ttl">${s.icon} ${s.title} <small>第${run.pi + 1}話「${p.t}」</small></div></div>
<div class="steps">${STEPNAME.map((x, i) => `<div class="st ${i + 1 < n ? 'done' : ''} ${i + 1 === n ? 'cur' : ''}"><b>${i + 1}</b>${x}</div>`).join('')}</div>
<div class="tip">💡 点線の下線がある言葉をタップすると、<b>読みと意味</b>が出ます。</div>`;
  }
  function stepView() {
    const p = STORIES[run.si].parts[run.pi], st = STEPS[run.step];
    $app.innerHTML = head() + '<div id="box"></div><div id="nxw"></div>';
    $('bk').onclick = home;
    const fin = () => {
      $('nxw').innerHTML = `<div class="okmsg">🎉 ${praise[Math.floor(Math.random() * praise.length)]}</div><button class="btn big" id="nx">つぎへ ▶</button>`;
      $('nx').onclick = () => { run.step++; if (run.step >= STEPS.length) result(); else stepView(); };
      $('nx').scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
    ({ find: stepFind, ref: stepRef, gist: stepGist, conj: stepConj, mcq: stepMcq })[st](p, $('box'), fin);
    window.scrollTo(0, 0);
  }

  function stepFind(p, box, done) {
    const n = parse(p.tx).filter(t => t.k === 'ref').length;
    box.innerHTML = `<div class="card"><h2>STEP1-1　指示語（こそあどことば）を探そう</h2>
<p class="inst">「これ・それ・あの・そこ」のように、ものや場所、ことがらを指すことばが<b>指示語</b>です。<br>下線がひいてある言葉の中から、<b>指示語</b>をすべて選ぼう。（正解は ${n}こ）</p>
${passage(p.tx, 'find')}<div class="msg" id="msg"></div><button class="btn" id="chk">これでいい！</button></div>`;
    const toks = [...box.querySelectorAll('.tok')]; let first = true;
    toks.forEach(t => t.onclick = () => { if (!t.disabled) t.classList.toggle('sel'); });
    $('chk').onclick = () => {
      const sel = toks.filter(t => t.classList.contains('sel'));
      const wrong = sel.filter(t => t.dataset.k === 'dec'), right = sel.filter(t => t.dataset.k === 'ref');
      const msg = $('msg');
      if (wrong.length || right.length < n) {
        first = false; let m = '';
        wrong.forEach(t => { t.classList.remove('sel'); t.classList.add('bad'); t.disabled = true; m += `<div>✖「${esc(t.textContent)}」…${esc(t.dataset.n || 'これは指示語ではありません。')}</div>`; });
        if (right.length < n) m += `<div>まだ見つかっていない指示語があります。「こ・そ・あ」ではじまることばを探そう。（いま ${right.length}こ）</div>`;
        msg.className = 'msg warn'; msg.innerHTML = m;
      } else {
        toks.forEach(t => { t.disabled = true; if (t.dataset.k === 'ref') { t.classList.remove('sel'); t.classList.add('ok'); } });
        const notes = toks.filter(t => t.dataset.k === 'dec' && t.dataset.n && !t.classList.contains('bad'));
        msg.className = 'msg good';
        msg.innerHTML = '⭕ 全部見つかりました！指示語は「こ・そ・あ」ではじまり、ものや場所、ことがらを指します。' + notes.map(t => `<div class="note">📝「${esc(t.textContent)}」…${esc(t.dataset.n)}</div>`).join('');
        $('chk').remove(); if (first) run.first++; done();
      }
    };
  }
  function stepRef(p, box, done) {
    const tk = parse(p.tx).filter(t => t.k === 'ref')[p.ref.i];
    box.innerHTML = `<div class="card"><h2>STEP1-2　指示語は何を指している？</h2>
<p class="inst">色のついた指示語「<b>${esc(tk.s)}</b>」は、何を指していますか。<br><span class="hint">ヒント：指示語の<b>前の文</b>に答えがかくれています。</span></p>
${passage(p.tx, 'ref', { i: p.ref.i })}<div id="ch"></div></div>`;
    choices($('ch'), p.ref.o.map((t, i) => ({ t, ok: i === 0 })), { note: p.ref.w, onDone: ok => { if (ok) run.first++; done(); } });
  }
  function stepGist(p, box, done) {
    const tpl = esc(p.gist.tpl).replace(/\[(\d)\]/g, (m, d) => `<span class="blank" data-b="${d}">${'①②③'[d - 1]}</span>`);
    box.innerHTML = `<div class="card"><h2>STEP2　要点をまとめよう</h2>
<p class="inst">この場面のあらすじ（要点）です。空らん①②に入る言葉を選んで、文を完成させよう。</p>
${passage(p.tx, 'plain')}<div class="summary"><div class="sl">📖 この場面の要点</div>${tpl}</div><div class="rows"></div></div>`;
    blanks(box, p.gist.b.map((b, i) => ({ id: String(i + 1), label: `${'①②③'[i]}に入る言葉`, o: b.o, w: b.w })), good => { run.first += good; done(); });
  }
  function stepConj(p, box, done) {
    const ids = parse(p.tx).filter(t => t.k === 'conj').map(t => t.id);
    box.innerHTML = `<div class="card"><h2>STEP3　つなぎの言葉（接続詞）を入れよう</h2>
<p class="inst">【A】【B】に入る、文と文をつなぐ言葉を選ぼう。<br><span class="hint">ヒント：前の文と後ろの文が「同じ向き」か「反対」か、「理由」か「言いかえ」かを考えよう。</span></p>
${passage(p.tx, 'conj')}<div class="rows"></div></div>`;
    blanks(box, p.conj.map((c, i) => ({ id: ids[i], label: `【${ids[i]}】に入る言葉`, o: c.o, w: c.w })), good => { run.first += good; done(); });
  }
  function stepMcq(p, box, done) {
    box.innerHTML = `<div class="card"><h2>STEP4　選択問題にちょうせん</h2>
<p class="inst">① まず、まちがいだと思う選択肢の <b>✕</b> をおして消そう（<b>消去法</b>）。<br>② のこった中から、<b>本文に書いてあること</b>をもとに答えを選ぼう。</p>
${passage(p.tx, 'plain')}<div class="q">${gl(p.q.s)}</div><div id="ch"></div><div class="ev" id="ev" hidden></div></div>`;
    choices($('ch'), p.q.o.map((x, i) => ({ t: x[0], w: x[1], ok: i === 0 })), {
      elim: true, revealAll: true,
      onDone: ok => { if (ok) run.first++; const ev = $('ev'); ev.hidden = false; ev.innerHTML = '📌 答えの手がかり（こんきょ）：<br>' + gl(p.q.ev); done(); }
    });
  }

  function result() {
    const s = STORIES[run.si], p = s.parts[run.pi], c = run.first;
    const stars = c >= 6 ? 3 : c >= 4 ? 2 : 1;
    const key = run.si + '-' + run.pi, old = (save[key] && save[key].stars) || 0;
    save[key] = { stars: Math.max(old, stars) }; persist();
    const msg = stars === 3 ? 'ほぼ完ぺき！読む力がしっかりついています。' : stars === 2 ? 'いい調子！まちがえたところを読み返すと、もっと力がつくよ。' : '最後までやりとげました！何度でもやり直して、★3つを目指そう。';
    const hasNext = run.pi + 1 < s.parts.length;
    $app.innerHTML = `<div class="top"><div class="ttl">${s.icon} ${s.title} <small>第${run.pi + 1}話「${p.t}」クリア</small></div></div>
<div class="card center"><div class="big-stars">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
<p class="score">一回目で正解したのは ${c} / ${run.total} 問</p><p>${msg}</p>
<div class="teaser">📚 ${gl(p.tz)}</div>
${hasNext ? '<button class="btn big" id="go">つづきを読む ▶</button>' : ''}
<button class="btn sub" id="again">もう一度この話にちょうせん</button>
<button class="btn sub" id="hm">本だなにもどる</button></div>`;
    if (hasNext) $('go').onclick = () => startPart(run.si, run.pi + 1);
    $('again').onclick = () => startPart(run.si, run.pi);
    $('hm').onclick = home;
    petals();
  }
  function petals() {
    for (let i = 0; i < 36; i++) {
      const e = document.createElement('div'); e.className = 'petal'; e.textContent = ['🌸', '✨', '⭐'][i % 3];
      e.style.left = Math.random() * 100 + 'vw'; e.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
      e.style.animationDelay = (Math.random() * 1.2) + 's'; e.style.fontSize = (16 + Math.random() * 16) + 'px';
      document.body.appendChild(e); setTimeout(() => e.remove(), 7000);
    }
  }

  // ---- ホーム／読み返し ----
  const unlocked = (si, pi) => pi === 0 || !!save[si + '-' + (pi - 1)];
  function home() {
    let total = 0; Object.keys(save).forEach(k => total += save[k].stars || 0);
    $app.innerHTML = `<div class="hero"><h1>ものがたりで国語</h1><p class="sub">名作を読んで、解いて、自信をつけよう</p>
<p class="lead">5つの名作（要約）を、3話ずつ少しずつ読み進めます。1話ごとに <b>① 指示語 → ② 要点 → ③ 接続詞 → ④ 選択問題</b> の順に練習。小学校高学年〜中学1年生向けです。<br>下線の言葉をタップすると<b>読みと意味</b>が出ます。</p>
<div class="total">⭐ ここまでの星：<b>${total}</b> / ${STORIES.length * 3 * 3}</div></div>
<div class="shelf">${STORIES.map((s, si) => `<div class="book"><div class="bh"><span class="bi">${s.icon}</span><div><div class="bt">${s.title}</div><div class="ba">${s.author}　／　${s.genre}</div></div></div>
<p class="bb">${s.blurb}</p>
<div class="parts">${s.parts.map((p, pi) => {
      const k = si + '-' + pi, d = save[k], ok = unlocked(si, pi);
      return `<button class="pbtn ${d ? 'done' : ''} ${ok ? '' : 'lock'}" data-s="${si}" data-p="${pi}" ${ok ? '' : 'disabled'}><span class="pn">第${pi + 1}話</span><span class="pt">${p.t}</span><span class="pl">${LV[p.lv]}</span><span class="ps">${d ? '★'.repeat(d.stars) + '☆'.repeat(3 - d.stars) : (ok ? '▶ はじめる' : '🔒')}</span></button>`;
    }).join('')}</div>
${save[si + '-0'] ? `<button class="rd" data-s="${si}">📖 ここまでのお話を読みかえす</button>` : ''}</div>`).join('')}</div>
<p class="foot">※ 物語は名作（著作権の切れた作品）を、学習用にやさしく要約したものです。</p>`;
    document.querySelectorAll('.pbtn').forEach(b => b.onclick = () => startPart(+b.dataset.s, +b.dataset.p));
    document.querySelectorAll('.rd').forEach(b => b.onclick = () => readView(+b.dataset.s));
    window.scrollTo(0, 0);
  }
  function readView(si) {
    const s = STORIES[si];
    const body = s.parts.map((p, pi) => save[si + '-' + pi] ? `<h3>第${pi + 1}話「${p.t}」</h3><div class="passage">${gl(plain(p.tx))}</div>` : '').join('');
    $app.innerHTML = `<div class="top"><button class="back" id="bk">← もどる</button><div class="ttl">${s.icon} ${s.title} <small>${s.author}</small></div></div><div class="card">${body}</div>`;
    $('bk').onclick = home; window.scrollTo(0, 0);
  }

  // ---- 読み・意味のポップアップ ----
  const pop = document.createElement('div'); pop.id = 'pop'; document.body.appendChild(pop);
  document.addEventListener('click', e => {
    const g = e.target.closest && e.target.closest('.gl');
    if (!g) { pop.style.display = 'none'; return; }
    pop.innerHTML = `<div class="py">${g.dataset.y}</div><div class="pw">${g.textContent}</div>${g.dataset.m ? `<div class="pm">${g.dataset.m}</div>` : ''}`;
    pop.style.display = 'block';
    const r = g.getBoundingClientRect();
    pop.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - pop.offsetWidth - 8)) + 'px';
    pop.style.top = (r.bottom + window.scrollY + 6) + 'px';
  });

  home();
})();

</script>
</body>
</html>
